# Real-time data warehouse (SIMULATION): Kafka -> Spark Structured Streaming -> ClickHouse -> Grafana
# Historical WQP records are REPLAYED in time order by producer/producer.py; this is not a live feed.
# Start:  docker compose -f 07_dw_realtime/docker-compose.yml up -d     (stop the batch DW first to free memory)
# Grafana: http://127.0.0.1:3300  (anonymous viewer access; admin / wq_local_dev for editing)
services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: wq_kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
    mem_limit: 700m

  kafka-init:                                  # one-shot: create the topic before Spark subscribes to it
    image: apache/kafka:3.8.1
    container_name: wq_kafka_init
    depends_on: [kafka]
    entrypoint: ["/bin/sh", "-c"]
    command: ["until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do sleep 2; done; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic wq.results.replay --partitions 3 --replication-factor 1 && echo TOPIC READY"]
    restart: "no"
    mem_limit: 300m

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: wq_clickhouse
    ports: ["18123:8123", "19000:9000"]   # laptop:container (laptop ports changed to avoid clashes)
    environment:
      CLICKHOUSE_DB: wq_rt
      CLICKHOUSE_USER: wq
      CLICKHOUSE_PASSWORD: wq_local_dev          # local test password, not a real secret
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - wq_ch_data:/var/lib/clickhouse
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    mem_limit: 900m

  spark:
    image: apache/spark:3.5.3-python3
    container_name: wq_spark
    user: root
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      clickhouse: {condition: service_started}
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: wq.results.replay
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: wq
      CLICKHOUSE_PASSWORD: wq_local_dev
    command: >
      /opt/spark/bin/spark-submit --master local[2] --driver-memory 700m
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      --conf spark.jars.ivy=/tmp/ivy --conf spark.sql.shuffle.partitions=4
      --conf spark.ui.showConsoleProgress=false
      /app/stream_job.py
    volumes:
      - ./spark:/app:ro
      - wq_spark_ivy:/tmp/ivy
      - wq_spark_chk:/tmp/checkpoints
    ports: ["4040:4040"]
    mem_limit: 1200m
    restart: on-failure

  grafana:
    image: grafana/grafana:11.3.0
    container_name: wq_grafana
    depends_on: [clickhouse]
    ports: ["3300:3000"]                  # Grafana at http://127.0.0.1:3300
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: wq_local_dev
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wq_realtime.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 350m

volumes:
  wq_ch_data:
  wq_spark_ivy:
  wq_spark_chk:
